[package]
name = "lynx-rustler-metadata"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustler = "=0.39.0"
libloading = "0.9"
syn = { version = "3", features = ["full", "visit", "visit-mut", "extra-traits"] }
proc-macro2 = "1"
serde_json = "1"
