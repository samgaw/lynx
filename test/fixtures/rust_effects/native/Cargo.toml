[package]
name = "effects-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
nif = []
payload-nif = ["nif"]
resource-nif = ["nif"]
resource-handles = ["resource-nif"]
locked-resource-handles = ["nif"]
future-resource-handles = ["locked-resource-handles"]
file-resource-handles = ["nif"]
file-resource-sync = ["file-resource-handles"]
file-resource-write = ["file-resource-sync"]
locked-file-resource-handles = ["nif"]

[dependencies]
effects-core = { path = "../core" }
rustler = "=0.39.0"
