[package]
name = "ownership-nif"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
rwlock = []
rw-resource = []
try-lock = []
borrowed-guard = []
captured-unwind = []
guard-unwind = []
resource-unwind = []
resource-return = ["resource-unwind"]

[dependencies]
ownership-app = { path = "../app" }
rustler = "=0.39.0"
