[package]
name = "io-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
io-protocol = { path = "../protocol" }
rustler = "=0.39.0"

[features]
shared-log = []
captured-write = []
async-write = []
async-shared-write = ["shared-log"]
async-readonly = ["async-shared-write"]
async-sync = ["async-shared-write"]
