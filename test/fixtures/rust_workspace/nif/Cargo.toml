[package]
name = "experiment-nif"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
unsupported-float = []
composite = []
optional = []
scalar-vec = []
derived-tuple = []
derived-tuple-decoder = ["derived-tuple"]
derived-map = []
derived-map-decoder = ["derived-map"]
derived-struct = []
derived-struct-decoder = ["derived-struct"]
derived-list = []
derived-tagged = []
checked-option = []
binary = []
protocol = ["binary"]
collections = []
unsupported-binary-method = ["binary"]
custom-encoder = []
custom-decoder = []
nif-result = []
validated-decoder = []
atom-errors = ["validated-decoder"]
boxed-errors = []
string-errors = []

[dependencies]
experiment-analysis = { path = "../analysis" }
rustler = "=0.39.0"
