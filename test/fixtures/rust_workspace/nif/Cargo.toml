[package]
name = "experiment-nif"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
owned-tree = []
unsupported-float = []
composite = []
optional = []
scalar-vec = []
derived-tuple = []
derived-tuple-decoder = ["derived-tuple"]
derived-map = []
derived-map-decoder = ["derived-map"]
derived-struct = []
derived-struct-decoder = ["derived-struct"]
derived-list = []
derived-tagged = []
derived-tagged-decoder = ["derived-tagged"]
checked-option = []
scalar-callbacks = []
borrowed-prefix = []
binary = []
protocol = ["binary"]
text-views = ["binary"]
slice-index = ["binary"]
slice-prefix = ["binary"]
prefix-consume = ["binary"]
suffix-consume = ["prefix-consume"]
nested-protocol = ["binary"]
producer-protocol = ["nested-protocol"]
named-arrays = []
named-slices = ["named-arrays"]
collections = []
unsupported-binary-method = ["binary"]
custom-encoder = []
custom-decoder = []
nif-result = []
validated-decoder = []
atom-errors = ["validated-decoder"]
boxed-errors = []
string-errors = []

[dependencies]
experiment-analysis = { path = "../analysis" }
rustler = "=0.39.0"
